<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ハイライトのカバー（1080×1920）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;display=swap">
<link rel="stylesheet" href="ig.css">
</head>
<body>
<!-- Instagram のハイライトは中央が円形に切り抜かれて表示されるため、絵柄は中央の円の中に収めている -->

<!-- 1. 連携とは（家） -->
<section class="frame story hl">
  <div class="mark">
    <svg viewBox="0 0 100 100"><path d="M16 50 50 20l34 30"/><path d="M26 42v38h48V42"/><path d="M43 80V60h14v20"/></svg>
    <p class="en">About</p>
  </div>
</section>

<!-- 2. 実績（グラフ） -->
<section class="frame story hl">
  <div class="mark">
    <svg viewBox="0 0 100 100"><path d="M18 82h64"/><path d="M28 82V58"/><path d="M44 82V44"/><path d="M60 82V52"/><path d="M76 82V28"/><path d="M26 44l18-16 16 10 18-18"/></svg>
    <p class="en">Record</p>
  </div>
</section>

<!-- 3. 協業の流れ（ステップ） -->
<section class="frame story hl">
  <div class="mark">
    <svg viewBox="0 0 100 100"><circle cx="22" cy="50" r="9"/><circle cx="50" cy="50" r="9"/><circle cx="78" cy="50" r="9"/><path d="M31 50h10"/><path d="M59 50h10"/><path d="M22 70v8"/><path d="M50 70v8"/><path d="M78 70v8"/></svg>
    <p class="en">Flow</p>
  </div>
</section>

<!-- 4. よくある質問（Q） -->
<section class="frame story hl">
  <div class="mark">
    <svg viewBox="0 0 100 100"><path d="M20 26h60v40H48L32 80V66H20z"/><path d="M42 40a8 8 0 1 1 11 7.4c-2 .9-3 2.4-3 4.6"/><path d="M50 58.5v.5"/></svg>
    <p class="en">Q &amp; A</p>
  </div>
</section>

<!-- 5. お問い合わせ（電話） -->
<section class="frame story hl">
  <div class="mark">
    <svg viewBox="0 0 100 100"><path d="M30 20h12l6 16-8 6a36 36 0 0 0 18 18l6-8 16 6v12a6 6 0 0 1-6 6C46 76 24 54 24 26a6 6 0 0 1 6-6z"/></svg>
    <p class="en">Contact</p>
  </div>
</section>

</body>
</html>
